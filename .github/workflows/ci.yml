name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 安装依赖
        run: uv sync --locked

      - name: 运行测试
        run: uv run pytest